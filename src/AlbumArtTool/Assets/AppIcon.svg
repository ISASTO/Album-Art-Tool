<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><!-- Muzikette: a brushed-silver panel with a tape window and its orange power light. --><defs><linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2F1ED"/><stop offset="1" stop-color="#C4C3BD"/></linearGradient><pattern id="brush" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1.5" fill="#FFFFFF" fill-opacity=".28"/><rect y="3" width="6" height="1.5" fill="#000000" fill-opacity=".03"/></pattern><linearGradient id="slot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#1E1D1B"/></linearGradient><radialGradient id="led" cx=".4" cy=".35" r=".7"><stop stop-color="#FFB08A"/><stop offset=".45" stop-color="#FF5B14"/><stop offset="1" stop-color="#E84E0C"/></radialGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="drop" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity=".25"/></filter></defs><g transform="translate(-29.83 -29.83) scale(0.55825)"><g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#silver)"/></g><rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#8F8E89" stroke-width="4"/><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#brush)"/><rect x="260" y="104" width="504" height="4" rx="2" fill="#FFFFFF" fill-opacity=".85"/><rect x="226" y="446" width="402" height="108" rx="54" fill="url(#slot)"/><rect x="262" y="552" width="330" height="4" rx="2" fill="#FFFFFF" fill-opacity=".8"/><circle cx="748" cy="500" r="60" fill="url(#led)" filter="url(#glow)"/><circle cx="731" cy="482" r="17" fill="#FFE3D4" fill-opacity=".9"/></g></svg>