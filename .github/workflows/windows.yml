name: Build, test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      showcase:
        description: 'Only take the README screenshots (real albums, fetched on the build machine)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Tests (Linux, headless GUI)
    if: ${{ !inputs.showcase }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install FFmpeg (test-only audio decoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build
        run: dotnet build tests/AlbumArtTool.Tests/AlbumArtTool.Tests.csproj -c Release
      - name: Run tests
        run: ALBUMART_FFMPEG="$(command -v ffmpeg)" dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll "$PWD/TestResults"
      - name: TEMP print screenshots
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in TestResults/*.png; do convert "$f" -resize '1400x1400>' -quality 82 "${f%.png}.jpg" 2>/dev/null || cp "$f" "${f%.png}.jpg"; echo "==SHOT $(basename "$f")"; base64 -w0 "${f%.png}.jpg"; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-test-screenshots
          path: TestResults/*.png
          if-no-files-found: ignore

  windows:
    name: Tests, AOT build and installer (Windows)
    if: ${{ !inputs.showcase }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only audio decoder
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Build tests
        run: dotnet build tests/AlbumArtTool.Tests/AlbumArtTool.Tests.csproj -c Release
      - name: Run tests (real audio files, rollback, scanning, headless GUI)
        shell: pwsh
        run: |
          $env:ALBUMART_FFMPEG = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll "$PWD/TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan benchmark
        continue-on-error: true
        shell: pwsh
        run: |
          $env:ALBUMART_FFMPEG = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --benchmark
      - name: Live album lookup and high-resolution image download
        continue-on-error: true
        run: dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --live-search "${{ github.workspace }}/TestResults"
      - name: Live FFmpeg download, checksum, licenses and launch
        continue-on-error: true
        run: dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --live-encoder
      - name: Live YouTube Music search and album pages
        continue-on-error: true
        run: dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --live-youtube-music
      - name: Live yt-dlp and Deno download, checksums and launch
        continue-on-error: true
        run: dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --live-ytdlp

      - name: Publish native (AOT) app
        run: dotnet publish src/AlbumArtTool/AlbumArtTool.csproj -c Release -r win-x64 -o dist/app
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\dist\app" "/DOutputDir=$PWD\dist" installer\AlbumArtTool.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\app | Format-Table Name, Length
          Write-Host ("Installer: {0:N1} MB" -f ((Get-Item dist\Muzikette-Setup.exe).Length / 1MB))
      - name: Build v2.x update bridge
        shell: pwsh
        run: |
          dotnet build src/LegacyBridge/LegacyBridge.csproj -c Release "-p:SetupPath=$PWD\dist\Muzikette-Setup.exe" -o dist/bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bridge = Get-Item dist\bridge\AlbumArtTool.exe
          $name = [Reflection.AssemblyName]::GetAssemblyName($bridge.FullName)
          if ($name.Name -ne 'AlbumArtTool' -or $name.Version -ne [Version]"${{ steps.version.outputs.value }}.0") { throw "Bridge identity $($name.Name) $($name.Version) will not be accepted by v2.x updaters." }
          if ($bridge.Length -gt 50MB) { throw "Bridge is larger than the 50 MB limit of v2.x updaters." }
          Write-Host ("Bridge: {0:N1} MB, {1} {2}" -f ($bridge.Length / 1MB), $name.Name, $name.Version)

      - name: Install silently, launch, measure startup, uninstall
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\install-test"
          $p = Start-Process dist\Muzikette-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup failed with $($p.ExitCode)" }
          $exe = Join-Path $dir 'Muzikette.exe'
          if (-not (Test-Path $exe) -or -not (Test-Path (Join-Path $dir 'unins000.exe'))) { throw 'Installed files are missing.' }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "Installed $($info.ProductName) $($info.FileVersion)"
          # The native build reads and writes tags in all nine formats and reports a damaged file.
          $report = "$env:RUNNER_TEMP\self-test.txt"
          $t = Start-Process $exe -ArgumentList '--self-test', ('"' + "$PWD\tests\AlbumArtTool.Tests\fixtures" + '"'), ('"' + $report + '"') -PassThru -Wait
          Write-Host "Native self-test: $(Get-Content $report -Raw)"
          if ($t.ExitCode -ne 0) { throw "Native self-test failed with $($t.ExitCode)" }
          $music = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\empty-music"
          function Measure-Startup($path) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $app = Start-Process $path -ArgumentList ('"' + $music.FullName + '"') -PassThru
            while ($clock.Elapsed.TotalSeconds -lt 30) { $app.Refresh(); if ($app.HasExited) { throw "$path exited during startup." }; if ($app.MainWindowHandle -ne 0 -and $app.Responding) { break }; Start-Sleep -Milliseconds 20 }
            $ms = $clock.ElapsedMilliseconds
            Start-Sleep -Seconds 2; $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0 -or -not $app.Responding) { throw "$path did not open a responsive window." }
            $mb = [math]::Round($app.WorkingSet64 / 1MB)
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(10000)) { $app.Kill(); throw "$path did not close cleanly." }
            return @($ms, $mb)
          }
          $new = @(1..3 | ForEach-Object { Measure-Startup $exe })
          Write-Host "v${{ steps.version.outputs.value }} window ready (ms, MB): $($new -join ', ')"
          try {
            $old = "$env:RUNNER_TEMP\v2\AlbumArtTool.exe"; New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
            Invoke-WebRequest https://github.com/ISASTO/Album-Art-Tool/releases/download/v2.5.2/AlbumArtTool.exe -OutFile $old
            $prior = @(1..3 | ForEach-Object { Measure-Startup $old })
            Write-Host "v2.5.2 window ready (ms, MB): $($prior -join ', ')"
            "| | Window ready (ms) | Memory (MB) |`n|---|---|---|`n| v${{ steps.version.outputs.value }} | $($new[0]), $($new[2]), $($new[4]) | $($new[1]) |`n| v2.5.2 | $($prior[0]), $($prior[2]), $($prior[4]) | $($prior[1]) |" >> $env:GITHUB_STEP_SUMMARY
          } catch { Write-Host "Comparison with v2.5.2 skipped: $_" }
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          Start-Sleep -Seconds 2
          if ($u.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall did not remove the app.' }

      - name: Upgrade a v2.5.2 portable copy through its own built-in updater
        shell: pwsh
        run: |
          # Runs the real v2.5.2 update helper against the new bridge, exactly as "Get updates" does.
          $root = "$env:RUNNER_TEMP\legacy"; $app = "$root\app\AlbumArtTool.exe"; $stage = "$root\stage"; $music = "$root\music & 100% élite"
          New-Item -ItemType Directory -Force "$root\app", $stage, $music | Out-Null
          Invoke-WebRequest https://github.com/ISASTO/Album-Art-Tool/releases/download/v2.5.2/AlbumArtTool.exe -OutFile $app
          Copy-Item $app "$stage\Updater.exe"; Copy-Item dist\bridge\AlbumArtTool.exe "$stage\Download.exe"
          $hash = { param($p) (Get-FileHash $p -Algorithm SHA256).Hash.ToLower() }
          $parent = Start-Process $app -ArgumentList ('"' + $music + '"') -PassThru
          Start-Sleep -Seconds 4; $parent.Refresh()
          $id = [guid]::NewGuid().ToString('N')
          $job = [ordered]@{ Target = $app; MusicFolder = $music; OriginalHash = (& $hash $app); DownloadHash = (& $hash "$stage\Download.exe");
                             Version = "${{ steps.version.outputs.value }}.0"; Id = $id; ParentId = $parent.Id; ParentStarted = $parent.StartTime.ToUniversalTime().Ticks }
          $job | ConvertTo-Json | Set-Content -Encoding utf8 "$stage\job.json"
          $ready = New-Object Threading.EventWaitHandle($false, 'ManualReset', "Local\AlbumArtTool-update-ready-$id")
          $helper = Start-Process "$stage\Updater.exe" -ArgumentList '--apply-update' -WorkingDirectory $stage -PassThru
          if (-not $ready.WaitOne(30000)) { if (Test-Path "$stage\error.txt") { Get-Content "$stage\error.txt" }; throw 'The v2.5.2 helper did not accept the update.' }
          $null = $parent.CloseMainWindow(); if (-not $parent.WaitForExit(15000)) { $parent.Kill() }
          if (-not $helper.WaitForExit(90000)) { throw 'The v2.5.2 helper did not finish.' }
          if (Test-Path "$stage\error.txt") { Get-Content "$stage\error.txt"; throw 'The v2.5.2 helper reported an error.' }
          if ($helper.ExitCode -ne 0) { throw "Helper exit code $($helper.ExitCode)" }
          if ((& $hash $app) -ne $job.DownloadHash) { throw 'The portable EXE was not replaced by the bridge.' }
          $installed = "$env:LOCALAPPDATA\Programs\Muzikette\Muzikette.exe"
          $clock = [Diagnostics.Stopwatch]::StartNew()
          while (-not (Get-Process Muzikette -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $installed -and $_.MainWindowHandle -ne 0 } catch { $false } })) {
            if ($clock.Elapsed.TotalSeconds -gt 90) { throw 'The installed app did not start after the upgrade.' }; Start-Sleep -Milliseconds 250 }
          $running = Get-Process Muzikette | Where-Object { $_.Path -eq $installed }
          $cmd = (Get-CimInstance Win32_Process -Filter "ProcessId = $($running.Id)").CommandLine
          Write-Host "Upgraded and reopened: $cmd"
          if ($cmd -notlike "*$music*") { throw 'The music folder was not preserved.' }
          $null = $running.CloseMainWindow(); $null = $running.WaitForExit(10000)
          # Later launches of the old portable EXE just open the installed app.
          $forward = Start-Process $app -PassThru; $null = $forward.WaitForExit(30000)
          Start-Sleep -Seconds 3
          $again = Get-Process Muzikette -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed }
          if (-not $again) { throw 'The old portable EXE did not forward to the installed app.' }
          $again | ForEach-Object { $null = $_.CloseMainWindow(); $null = $_.WaitForExit(10000) }
          Start-Process "$env:LOCALAPPDATA\Programs\Muzikette\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait

      - name: Upgrade an installed Music Library Manager 3.12.1 to Muzikette
        shell: pwsh
        run: |
          # The real 3.12.1 installer, then this build's installer over it, as "Get updates" does.
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Muzikette", "$env:LOCALAPPDATA\AlbumArtTool" -ErrorAction SilentlyContinue
          $old = "$env:RUNNER_TEMP\v3\AlbumArtTool-Setup.exe"; New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
          Invoke-WebRequest https://github.com/ISASTO/Album-Art-Tool/releases/download/v3.12.1/AlbumArtTool-Setup.exe -OutFile $old
          $p = Start-Process $old -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "3.12.1 setup failed with $($p.ExitCode)" }
          $oldDir = "$env:LOCALAPPDATA\Programs\Music Library Manager"
          if (-not (Test-Path "$oldDir\AlbumArtTool.exe")) { throw '3.12.1 did not install where expected.' }
          # Settings and an Undo journal written by 3.x, with paths inside its data folder.
          $oldData = "$env:LOCALAPPDATA\AlbumArtTool"; $run = "$oldData\LibraryBackups\run-1"
          New-Item -ItemType Directory -Force $run, "$oldData\New music" | Out-Null
          Set-Content -Encoding utf8 "$oldData\appearance.txt" 'dark'
          Set-Content -Encoding utf8 "$oldData\new-music-folder.txt" "$oldData\New music"
          Set-Content -Encoding utf8 "$oldData\last-library-run.txt" "$run\journal.json"
          @{ Root = "$env:RUNNER_TEMP\music"; Directory = $run; Entries = @(@{ Index = 0; Source = "$env:RUNNER_TEMP\music\a.mp3"; Target = "$env:RUNNER_TEMP\music\b.mp3"; Backup = "$run\files\a.mp3"; State = 'done' }) } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$run\journal.json"
          $p = Start-Process dist\Muzikette-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Muzikette setup failed with $($p.ExitCode)" }
          $newDir = "$env:LOCALAPPDATA\Programs\Muzikette"
          if (-not (Test-Path "$newDir\Muzikette.exe")) { throw 'The upgrade did not install Muzikette.exe in the Muzikette folder.' }
          if (Test-Path $oldDir) { Get-ChildItem $oldDir -Recurse | Format-Table FullName; throw 'The old Music Library Manager folder was not removed.' }
          $menu = [Environment]::GetFolderPath('Programs')
          if (Test-Path "$menu\Music Library Manager") { throw 'The old Start menu folder was not removed.' }
          if (-not (Test-Path "$menu\Muzikette\Muzikette.lnk")) { throw 'The Muzikette Start menu shortcut is missing.' }
          $uninstall = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6C4C3B4E-0F2B-4B5E-9E61-5C2B8D7A3A11}_is1'
          Write-Host "Apps & features: $($uninstall.DisplayName) $($uninstall.DisplayVersion) in $($uninstall.InstallLocation)"
          if ($uninstall.DisplayName -ne 'Muzikette') { throw 'Apps & features still shows the old name.' }
          # First launch moves the data folder and rewrites the paths saved in it.
          $music = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\music"
          $app = Start-Process "$newDir\Muzikette.exe" -ArgumentList ('"' + $music.FullName + '"') -PassThru
          $clock = [Diagnostics.Stopwatch]::StartNew()
          while ($clock.Elapsed.TotalSeconds -lt 30) { $app.Refresh(); if ($app.MainWindowHandle -ne 0) { break }; Start-Sleep -Milliseconds 100 }
          $null = $app.CloseMainWindow(); if (-not $app.WaitForExit(10000)) { $app.Kill() }
          $data = "$env:LOCALAPPDATA\Muzikette"
          if (Test-Path $oldData) { throw 'The old data folder was not moved.' }
          if ((Get-Content "$data\appearance.txt" -Raw).Trim() -ne 'dark') { throw 'Settings were not kept.' }
          if ((Get-Content "$data\new-music-folder.txt" -Raw).Trim() -ne "$data\New music") { throw 'The New music folder path was not updated.' }
          if ((Get-Content "$data\last-library-run.txt" -Raw).Trim() -ne "$data\LibraryBackups\run-1\journal.json") { throw 'The last Organize run path was not updated.' }
          $journal = Get-Content "$data\LibraryBackups\run-1\journal.json" -Raw | ConvertFrom-Json
          if ($journal.Directory -ne "$data\LibraryBackups\run-1" -or $journal.Entries[0].Backup -ne "$data\LibraryBackups\run-1\files\a.mp3" -or $journal.Entries[0].Source -ne "$env:RUNNER_TEMP\music\a.mp3") { throw 'The Undo journal paths were not updated.' }
          Write-Host 'Upgraded 3.12.1 to Muzikette: program folder, shortcuts, uninstall entry and data folder moved.'
          Start-Process "$newDir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\Muzikette-Setup.exe release\
          # The same installer under its pre-4.0 name, for copies of Music Library Manager 3.x to update from.
          Copy-Item dist\Muzikette-Setup.exe release\AlbumArtTool-Setup.exe
          Copy-Item dist\bridge\AlbumArtTool.exe release\
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt dist\app\
          Copy-Item licenses dist\app\licenses -Recurse -Force
          Compress-Archive -Path dist\app\* -DestinationPath release\Muzikette-Portable.zip
          Get-ChildItem release -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-screenshots
          path: |
            TestResults/*.png
            TestResults/live-cover.jpg
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Muzikette-Windows
          path: release/*
          if-no-files-found: error

  # README screenshots on a library of real albums. Covers and track lists are fetched here, on the build machine, and
  # never committed; the audio is silence of each track's length. Run by hand: Actions › Run workflow › showcase.
  showcase:
    name: README screenshots (real albums)
    if: github.event_name == 'workflow_dispatch' && inputs.showcase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and tagging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python -m pip install --quiet mutagen==1.47.0 pillow==11.0.0
      - name: Build a library of real albums
        run: python tools/showcase/library.py "$RUNNER_TEMP/library" "$RUNNER_TEMP/covers"
      - name: Build
        run: dotnet build tests/AlbumArtTool.Tests/AlbumArtTool.Tests.csproj -c Release
      - name: Take the screenshots
        run: ALBUMART_FFMPEG="$(command -v ffmpeg)" dotnet tests/AlbumArtTool.Tests/bin/Release/net10.0/AlbumArtTool.Tests.dll --showcase "$RUNNER_TEMP/library" "$RUNNER_TEMP/covers" "$PWD/showcase"
      - name: Print the screenshots
        if: always()
        run: for f in showcase/*.png; do echo "==PNG $(basename "$f")"; base64 -w0 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: README-screenshots
          path: showcase/*.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Muzikette-Windows
          path: release
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="v$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("Directory.Build.props").find(".//Version").text)')"
          fi
          # Notes come from the release commit message (without the [release] marker).
          NOTES="$(printf '%s' "$COMMIT_MESSAGE" | sed -e 's/\[release\] *//' -e '/^Co-Authored-By:/d' -e '/^Claude-Session:/d')"
          [ -n "$NOTES" ] || NOTES="Muzikette $RELEASE_TAG"
          NOTES="$(printf '%s\n\nInstall Muzikette-Setup.exe, or use Get updates in the app.' "$NOTES")"
          gh release create "$RELEASE_TAG" release/Muzikette-Setup.exe release/AlbumArtTool-Setup.exe release/AlbumArtTool.exe release/Muzikette-Portable.zip release/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" --title "Muzikette $RELEASE_TAG" --notes "$NOTES"
