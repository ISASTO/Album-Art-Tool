name: explore
on: { push: { branches: [ytm-explore] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: |
          cat > probe.py <<'PY'
          import json, urllib.request, re, sys
          CTX={"client":{"clientName":"WEB_REMIX","clientVersion":"1.20251015.01.00","hl":"en","gl":"US"}}
          def call(ep, body):
              body=dict(body); body["context"]=CTX
              req=urllib.request.Request("https://music.youtube.com/youtubei/v1/"+ep+"?prettyPrint=false", data=json.dumps(body).encode(), headers={"Content-Type":"application/json","Origin":"https://music.youtube.com","User-Agent":"Mozilla/5.0"})
              return json.load(urllib.request.urlopen(req))
          def walk(o,key,out):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k==key: out.append(v)
                      walk(v,key,out)
              elif isinstance(o,list):
                  for v in o: walk(v,key,out)
              return out
          def runs(t): return [r.get("text") for r in (t or {}).get("runs",[])]
          for q in ["Camera Obscura My Maudlin Career","Yeule Glitch Princess","Kanye West Donda"]:
              d=call("search",{"query":q,"params":"EgWKAQIYAWoMEA4QChADEAQQCRAF"})
              items=walk(d,"musicResponsiveListItemRenderer",[])
              print("== SEARCH",q,len(items))
              for it in items[:3]:
                  fc=[runs(c["musicResponsiveListItemFlexColumnRenderer"]["text"]) for c in it.get("flexColumns",[])]
                  print("  ",fc, it.get("navigationEndpoint",{}).get("browseEndpoint",{}).get("browseId"))
              bid=items[0]["navigationEndpoint"]["browseEndpoint"]["browseId"]
              a=call("browse",{"browseId":bid})
              h=walk(a,"musicResponsiveHeaderRenderer",[])[0]
              print("  HEADER", {k:runs(h.get(k)) for k in ["title","subtitle","straplineTextOne","secondSubtitle"]})
              print("  micro", a.get("microformat",{}).get("microformatDataRenderer",{}).get("urlCanonical"))
              tracks=walk(a.get("contents"),"musicResponsiveListItemRenderer",[])
              print("  tracks",len(tracks))
              for t in tracks[:4]+tracks[-1:]:
                  fc=[runs(c["musicResponsiveListItemFlexColumnRenderer"]["text"]) for c in t.get("flexColumns",[])]
                  fx=[runs(c["musicResponsiveListItemFixedColumnRenderer"]["text"]) for c in t.get("fixedColumns",[])]
                  we=walk(t,"watchEndpoint",[])
                  vt=[w.get("watchEndpointMusicSupportedConfigs",{}).get("watchEndpointMusicConfig",{}).get("musicVideoType") for w in we]
                  print("    idx",runs(t.get("index")),"flex",fc,"fixed",fx,"pid",t.get("playlistItemData"),"vt",vt, "flexnav", [walk(c,"watchEndpoint",[]) and walk(c,"watchEndpoint",[])[0].get("videoId") for c in t.get("flexColumns",[])][:1])
              s=json.dumps(a); print("  ATV count", s.count("MUSIC_VIDEO_TYPE_ATV"), "OMV", s.count("MUSIC_VIDEO_TYPE_OMV"), "counterpart" in s)
          # next endpoint for an OMV item, to find the audio counterpart
          d=call("next",{"videoId":"NNpmfkBcPwg","playlistId":"OLAK5uy_lRQlA5HmGHloTKr_XvsRsyB8964iwV8jo"})
          s=json.dumps(d); print("NEXT keys", list(d.keys()), "counterpart" in s)
          cp=walk(d,"counterpart",[])
          print("COUNTERPART", json.dumps(cp[:1])[:1500])
          pr=walk(d,"playlistPanelVideoRenderer",[])
          for p in pr[:3]: print("PANEL", runs(p.get("title")), p.get("videoId"), runs(p.get("lengthText")), walk(p,"musicVideoType",[])[:1])
          PY
          python probe.py
